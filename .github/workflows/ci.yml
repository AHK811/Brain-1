name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  parity-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Validate the notebooks
        run: |
          python - <<'PY'
          import ast, json, pathlib, sys
          failed = []
          for path in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              book = json.loads(path.read_text(encoding="utf-8"))
              if book.get("nbformat") != 4:
                  failed.append(f"{path}: nbformat {book.get('nbformat')!r}, expected 4")
              for index, cell in enumerate(book["cells"]):
                  if cell["cell_type"] != "code":
                      continue
                  source = "".join(cell["source"])
                  if not source or source.startswith(("%", "!")):
                      continue
                  try:
                      ast.parse(source)
                  except SyntaxError as error:
                      failed.append(f"{path} cell {index}: {error}")
          if failed:
              print("\n".join(failed), file=sys.stderr)
              sys.exit(1)
          print("notebooks parse")
          PY

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .[dev]

      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Generate the golden tensors the parity suites read
        run: python -m brainlab.export.make_golden --model --raw

      - name: cargo fmt
        working-directory: rust
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: rust
        run: cargo test --workspace --release

      - name: pytest
        run: pytest -q
