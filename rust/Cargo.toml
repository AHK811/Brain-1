[workspace]
resolver = "2"
members = [
  "crates/tokenizer",
  "crates/datapack",
  "crates/infer-cpu",
  "crates/pyo3-bindings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
half = { version = "2", features = ["std"] }
memmap2 = "0.9"
rayon = "1"
safetensors = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
pyo3 = { version = "0.22", features = ["abi3-py310", "extension-module", "anyhow"] }
brainlab-tokenizer = { path = "crates/tokenizer" }
brainlab-datapack = { path = "crates/datapack" }
brainlab-infer-cpu = { path = "crates/infer-cpu" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = true

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
