model:
  name: brain-gpt2-plus
  vocab_size: 32768
  max_position_embeddings: 2048
  hidden_size: 768
  num_layers: 12
  num_heads: 16
  num_kv_heads: 8
  intermediate_size: 3072
  rope_theta: 10000.0
  rope_scaling_type: ntk
  rope_scaling_factor: 2.0
  use_qk_norm: true
  attention_type: gqa
  norm_eps: 1.0e-5
  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: true
  dropout: 0.0
