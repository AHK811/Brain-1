# Brain v0.2 — ~27M parameter configuration (HISTORICAL / regression baseline)
#
# Do NOT edit this file to match v0.3. Tests and checkpoints depend on these
# exact values. For the current model use brain_0_3_35m.yaml.
#
#   - num_kv_heads=2: real GQA
#   - intermediate_size=1152: reinvests GQA savings
#   - vocab 16384, context 512 — original v0.2 gate numbers
model:
  name: brain-0.2
  vocab_size: 16384
  max_position_embeddings: 512
  hidden_size: 384
  num_layers: 12
  num_heads: 6
  num_kv_heads: 2
  intermediate_size: 1152
  rope_theta: 10000.0
  norm_eps: 1.0e-5
  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: true
  dropout: 0.0
