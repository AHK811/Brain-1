model:
  name: brain-deep64
  vocab_size: 32768
  max_position_embeddings: 4096
  hidden_size: 768
  num_layers: 64
  num_heads: 16
  num_kv_heads: 8
  intermediate_size: 3072
  rope_theta: 500000.0
  rope_scaling_type: yarn
  rope_scaling_factor: 2.0
  use_qk_norm: true
  attention_type: gqa
  tie_word_embeddings: true
  dropout: 0.0
