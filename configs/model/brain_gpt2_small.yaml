model:
  name: brain-gpt2-small
  vocab_size: 32768
  max_position_embeddings: 1024
  hidden_size: 768
  num_layers: 12
  num_heads: 12
  num_kv_heads: 12
  intermediate_size: 3072
  rope_theta: 10000.0
  rope_scaling_type: null
  rope_scaling_factor: 1.0
  norm_eps: 1.0e-5
  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: true
  dropout: 0.0
